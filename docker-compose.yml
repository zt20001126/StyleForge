services:
  postgres:
    image: postgres:16
    container_name: styleforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: styleforge_dev
      POSTGRES_USER: styleforge_user
      POSTGRES_PASSWORD: styleforge_password
    ports:
      - "55432:5432"
    volumes:
      - styleforge_postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styleforge_user -d styleforge_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: styleforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-styleforge_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-styleforge_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - styleforge_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  styleforge_postgres_data:
  styleforge_minio_data:
